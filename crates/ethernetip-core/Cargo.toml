[package]
name = "ethernetip-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "EtherNet/IP encapsulation and CIP transport primitives"

[dependencies]
tokio = { workspace = true }
thiserror = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
# Optional live-NIC query for the Ethernet Link CIP class (device::ethernet_link).
# Disabling the feature falls back to hardcoded MAC + 1 Gbps.
network-interface = { version = "2", optional = true }

[features]
default = ["live-nic"]
live-nic = ["dep:network-interface"]
